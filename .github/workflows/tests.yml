name: Playwright UI Tests with Allure Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Java (required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Run Pytest
        id: run_tests
        run: |
          pytest
        continue-on-error: true

      - name: Get Allure history from gh-pages
        if: always()
        run: |
          if git ls-remote --heads origin gh-pages | grep gh-pages; then
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
            mkdir -p allure-results
            if [ -d "history" ]; then
              cp -r history allure-results/
            fi
            git checkout -
          else
            echo "Branch gh-pages does not exist yet. Initial run."
          fi

      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** \`ubuntu-latest\` (Python 3.11, Chromium)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** \`${{ github.eventName }}\` on branch \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run_tests.outcome }}" = "success" ]; then
            echo "- **Execution Status:** ✅ **Passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Execution Status:** ❌ **Failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Reporting" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Allure Report:** [View Interactive Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)" >> $GITHUB_STEP_SUMMARY